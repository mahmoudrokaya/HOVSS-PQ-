
# ============================================================
# HOVSS-PQ — VISUAL SECRET SHARING CONFIGURATION
# ============================================================
#
# File: configs/security/visual_secret_sharing.yaml
# Version: 1.0.0
#
# Purpose:
# Define the mathematical, computational, and evaluation
# settings for visual secret sharing experiments.
#
# IMPORTANT:
# This is a proposed configuration specification.
# It does not establish the historical execution settings.
#
# null = not verified from original experimental records
# ============================================================

schema_version: "1.0"

configuration:
  name: visual_secret_sharing
  project: HOVSS-PQ
  version: "1.0.0"
  status: proposed
  provenance_type: proposed
  historical_execution_verified: false

# ------------------------------------------------------------
# 1. EXPERIMENT IDENTIFICATION
# ------------------------------------------------------------

experiment:
  identifier: null
  series: null
  description: >-
    Mathematical and computational evaluation of visual
    secret sharing, reconstruction correctness,
    confidentiality, and authentication-related
    construction properties.

  source_scripts: []
  source_evidence: []
  execution_command: null
  random_seed: null

# ------------------------------------------------------------
# 2. INPUT DATA
# ------------------------------------------------------------

dataset:
  name: null
  version: null
  source: null
  license: null

  input_directory: "data"
  file_manifest: "metadata/manifest.csv"

  image_format: null
  image_count: null
  image_width: null
  image_height: null

  color_mode: null

  preprocessing:
    binarization_enabled: null
    binarization_threshold: null
    resizing_enabled: null
    target_dimensions: null

  integrity:
    verify_sha256: true

# ------------------------------------------------------------
# 3. SECRET SHARING CONSTRUCTION
# ------------------------------------------------------------

construction:
  active_scheme: null

  supported_scheme_families:
    - classical_visual_cryptography
    - random_grid_visual_cryptography
    - xor_based_secret_sharing
    - authenticated_visual_secret_sharing

  threshold:
    required_shares: null
    total_shares: null

  share_generation:
    method: null
    randomization_method: null
    random_seed: null

    pixel_expansion: null
    share_dimensions: null

    output_format: null

  access_structure:
    authorized_sets: []
    unauthorized_sets: []

# ------------------------------------------------------------
# 4. MATHEMATICAL RECONSTRUCTION
# ------------------------------------------------------------

reconstruction:
  operator: null

  supported_operators:
    - OR
    - XOR

  model:
    input_domain: binary_images
    output_domain: binary_images

    alignment_assumption: null
    perfect_registration_required: null

  correctness:
    enabled: true
    exact_match_required: null

    metrics:
      - pixel_agreement
      - pixel_error_rate

  ambiguity:
    evaluate_non_injectivity: true

    collision_definition: null
    enumeration_domain: null
    enumeration_method: null

    metrics:
      - collision_count
      - equivalent_reconstruction_count

# ------------------------------------------------------------
# 5. CONFIDENTIALITY EVALUATION
# ------------------------------------------------------------

confidentiality:
  enabled: true

  threat_model:
    unauthorized_share_access: true
    public_reference_access: null

    adversary_knowledge: null

  evaluation:
    methods:
      - total_variation_distance

    metrics:
      - total_variation_distance

    distribution_estimation_method: null
    sample_count: null

  interpretation:
    zero_tv_indicates_equal_evaluated_distributions: true

    note: >-
      A measured total variation distance of zero
      applies to the evaluated distributions.
      It does not automatically establish
      universal information-theoretic secrecy.

# ------------------------------------------------------------
# 6. CONTENT INTEGRITY
# ------------------------------------------------------------

integrity:
  enabled: true

  construction_types:
    - masked_reference
    - separable_tag
    - integrated_witness

  active_construction: null

  content_binding:
    required: true
    binding_mechanism: null

    formally_proven: false

  reference:
    type: null
    visibility: null
    generation_method: null

  verification:
    method: null
    acceptance_rule: null
    decision_threshold: null

  evaluation:
    attacks:
      - content_modification
      - share_substitution
      - reference_manipulation

    metrics:
      - attack_acceptance_rate
      - attack_rejection_rate
      - false_acceptance_rate
      - false_rejection_rate

# ------------------------------------------------------------
# 7. ADVERSARIAL EVALUATION
# ------------------------------------------------------------

adversarial:
  enabled: true

  attacker:
    capabilities: []
    knowledge: null

  attack_generation:
    method: null
    number_of_trials: null
    random_seed: null

  adaptive_verification:
    enabled: null
    number_of_attempts: null
    challenge_visibility: null

  metrics:
    - forgery_acceptance_rate
    - attack_acceptance_rate

# ------------------------------------------------------------
# 8. OPTICAL RECONSTRUCTION INTERFACE
# ------------------------------------------------------------

optical_interface:
  enabled: true

  physical_superposition:
    intended: true
    experimentally_validated: false

  registration:
    required: true

    horizontal_shift_pixels: null
    vertical_shift_pixels: null
    rotation_degrees: null
    scale_factor: null

  disturbances:
    - pixel_displacement
    - rotation
    - scaling
    - ink_spreading

  metrics:
    - reconstruction_pixel_error_rate
    - reconstruction_accuracy

  physical_measurements:
    source_file: null
    completed: false

# ------------------------------------------------------------
# 9. HUMAN-OBSERVABLE VERIFICATION INTERFACE
# ------------------------------------------------------------

human_verification:
  objective: >-
    Investigate whether an unaided observer can
    distinguish authentic from manipulated
    optical reconstructions.

  synthetic_observer_evaluation:
    supported: true
    configuration_file: >-
      configs/perception/synthetic_observers.yaml

  human_participant_validation:
    completed: false
    configuration_file: >-
      configs/perception/human_study_protocol.yaml

  interpretation:
    synthetic_results_are_human_evidence: false

# ------------------------------------------------------------
# 10. REPORTED RESEARCH FINDINGS
# ------------------------------------------------------------
#
# These are manuscript-level reported observations,
# not parameters consumed by the experiment.
# Verify against original result files before release.
# ------------------------------------------------------------

reported_findings:

  masked_reference:
    public_view_total_variation_distance: 0.0

    content_modification:
      evaluated_submissions: 3072
      rejected_submissions: 3072

    evaluation_scope: exact_digital_verification

  separable_tag:
    content_modification:
      evaluated_submissions: 3072
      accepted_submissions: 3072

  reconstruction:
    ideal_pixel_agreement: 1.0

    one_pixel_displacement:
      pixel_error_rate: 0.7492

  provenance:
    source_result_files: []
    verified_against_raw_outputs: false

# ------------------------------------------------------------
# 11. EXPERIMENT OUTPUTS
# ------------------------------------------------------------

outputs:
  directory: "results/generated/visual_secret_sharing"

  preserve_original_outputs: true
  overwrite_existing: false

  save_generated_shares: true
  save_reconstructed_images: true
  save_evaluation_metrics: true

  formats:
    images:
      - png

    numerical:
      - csv
      - json

  result_manifest: null

# ------------------------------------------------------------
# 12. REPRODUCIBILITY
# ------------------------------------------------------------

reproducibility:
  environment_file: "environment.yml"
  requirements_file: "requirements.txt"

  verify_input_checksums: true
  verify_output_checksums: true

  require_random_seed_record: true
  require_execution_command: true

  compare_with_archived_results: true

  numerical_tolerance:
    absolute: null
    relative: null

  reproduction_status: not_verified

# ------------------------------------------------------------
# 13. MANUSCRIPT TRACEABILITY
# ------------------------------------------------------------

publication:
  manuscript_section: 5

  related_tables: []
  related_figures: []

  mapping_files:
    tables: "configs/publication/tables.yaml"
    figures: "configs/publication/figures.yaml"

  verified_manuscript_mapping: false

# ------------------------------------------------------------
# 14. SECURITY CLAIM BOUNDARIES
# ------------------------------------------------------------

security_scope:
  confidentiality_proven_for_all_schemes: false

  reconstruction_authenticity_proven: false

  end_to_end_optical_integrity_proven: false

  human_verification_validated: false

  note: >-
    Reconstruction correctness, confidentiality,
    share authenticity, content integrity, and
    human-observable verification are separate
    security properties. Evidence supporting one
    property must not be interpreted as proof
    of the others.

# ============================================================
# END OF CONFIGURATION
# ============================================================
